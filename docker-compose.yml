# Self-hosted Consultainer: Postgres + the app + a tiny scheduler.
# Full reference (every setting, jobs, proxies, backups): docs/self-hosting.mdx
#
#   curl -O https://raw.githubusercontent.com/Armistice-Group/retainer/main/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/Armistice-Group/retainer/main/.env.example
#   # fill in the Required section of .env (AUTH_SECRET, INTEGRATION_ENCRYPTION_KEY,
#   # CRON_SECRET, POSTGRES_PASSWORD; plus SETUP_TOKEN if this host is public)
#   docker compose up -d
#
# Every value below comes from .env; what each one is and how to generate it
# is explained in .env.example. Edit .env, not this file, then re-run
# `docker compose up -d` to apply changes.
#
# Upgrade: docker compose pull && docker compose up -d
# Pin a release with CONSULTAINER_VERSION=1.2.3 in .env (default: latest,
# which follows main).
# Build from source instead: see docker-compose.build.yml.
#
# Then open the app (http://<this-host>:3113 by default) — a fresh database
# redirects to /setup to create your organization and its owner account.
#
# Backup (custom-format dump; see docs/self-hosting.mdx for restore):
#   docker compose exec -T consultainer-db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > consultainer.dump

# Secrets the app refuses to start without (generate them as .env.example says).
x-required: &required
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (openssl rand -hex 32)}

services:
  # Postgres. The POSTGRES_* values are only applied when the db_data volume is
  # first created; changing them later doesn't change the database. The
  # fallbacks after :- apply only if .env leaves a value out.
  consultainer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-consulthub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-consulthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app. Runs `prisma migrate deploy` on every start, then serves on :3000.
  consultainer-app:
    # CONSULTAINER_VERSION: "latest" (main), or a release such as 0.1.0 / 0.1.
    image: ghcr.io/armistice-group/retainer:${CONSULTAINER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      consultainer-db:
        condition: service_healthy
    environment:
      <<: *required
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@consultainer-db:5432/${POSTGRES_DB:-consulthub}?schema=public
      # Optional. Leave unset and redirects follow whatever address the app is
      # reached at (localhost, hp.local, a domain); setting it forces one URL.
      AUTH_URL: ${AUTH_URL:-}
      # Let calendar links point at private-network addresses (off by default).
      ALLOW_PRIVATE_FETCH: ${ALLOW_PRIVATE_FETCH:-false}
      # Lets Auth.js build redirects from the request's Host / X-Forwarded-*.
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      # Recommended for public hosts: /setup asks for it before creating the owner.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Everything below is optional. Integration credentials can instead be
      # entered by the owner in Settings → Integrations / Payments; a value
      # set here wins and shows as read-only there.
      # Email (Resend).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # "Continue with Google" login (.env only).
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # QuickBooks Online.
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-}
      # Linear.
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      # Stripe Connect (online invoice payments).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # File services for linking and filing documents.
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      # Optional S3-compatible storage for uploads (docs/self-hosting.mdx).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
    # APP_PORT=127.0.0.1:3113 publishes only on localhost (for a reverse proxy).
    ports:
      - "${APP_PORT:-3113}:3000"

  # Drives the scheduled jobs (all idempotent). Starts 60s after launch, then
  # hourly: Mercury payment status, Linear sync, calendar sync, filing
  # catch-up. On the first pass and every 24 hours after: retainer invoices,
  # billing cycles, overdue alerts and reminders, and (Mondays) the weekly
  # digest. Uses the same CRON_SECRET as the app.
  scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - consultainer-app
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (openssl rand -hex 32)}
    entrypoint:
      - sh
      - -c
      - |
        sleep 60
        i=0
        while true; do
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/mercury-sync || true
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/linear-sync || true
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/calendar-sync || true
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/filing || true
          if [ $$((i % 24)) -eq 0 ]; then
            curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/recurring-invoices || true
          fi
          i=$$((i + 1))
          sleep 3600
        done

volumes:
  db_data:

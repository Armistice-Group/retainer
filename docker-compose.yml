# Self-hosted Consultainer: Postgres + the app + a tiny scheduler.
#
#   curl -O https://raw.githubusercontent.com/Armistice-Group/retainer/main/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/Armistice-Group/retainer/main/.env.example
#   # fill in the Required section of .env
#   docker compose up -d
#
# Upgrade: docker compose pull && docker compose up -d
# Pin a release with CONSULTAINER_VERSION=1.2.3 in .env (default: latest,
# which follows main).
# Build from source instead: see docker-compose.build.yml.
#
# Then open the app (http://<this-host>:3113 by default) — a fresh database
# redirects to /setup to create your organization and local admin account.

x-required: &required
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (openssl rand -hex 32)}

services:
  consultainer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-consulthub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-consulthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  consultainer-app:
    image: ghcr.io/armistice-group/retainer:${CONSULTAINER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      consultainer-db:
        condition: service_healthy
    environment:
      <<: *required
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@consultainer-db:5432/${POSTGRES_DB:-consulthub}?schema=public
      # Optional. Leave unset and redirects follow whatever address the app is
      # reached at (localhost, hp.local, a domain); setting it forces one URL.
      AUTH_URL: ${AUTH_URL:-}
      # Lets Auth.js build redirects from the request's Host / X-Forwarded-*.
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${APP_PORT:-3113}:3000"

  # Drives the scheduled jobs: Mercury payment sync hourly, recurring
  # invoices / overdue notices daily (both endpoints are idempotent).
  scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - consultainer-app
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (openssl rand -hex 32)}
    entrypoint:
      - sh
      - -c
      - |
        sleep 60
        i=0
        while true; do
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/mercury-sync || true
          if [ $$((i % 24)) -eq 0 ]; then
            curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$CRON_SECRET" http://consultainer-app:3000/api/cron/recurring-invoices || true
          fi
          i=$$((i + 1))
          sleep 3600
        done

volumes:
  db_data:

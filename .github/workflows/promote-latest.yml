name: Promote latest

# Moves ghcr.io/armistice-group/retainer:latest to a main commit once CI has
# passed for it. The image itself is built (and published as :latest-bleeding,
# :main and :sha-<short>) by docker.yml without waiting for tests; this only
# retags that build, so :latest is always a tested commit.
#
# Run it by hand with a commit SHA to re-point :latest (e.g. to roll back).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA on main whose image becomes :latest
        required: true

concurrency:
  group: promote-latest
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/armistice-group/retainer

jobs:
  promote:
    name: Promote :latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the commit is on main
        run: |
          SHA=$(git rev-parse --verify "$SHA^{commit}")
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "SHORT=sha-${SHA:0:7}" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SHA" origin/main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI usually finishes before both architectures are built and merged.
      - name: Wait for the image
        run: |
          for _ in $(seq 1 90); do
            docker buildx imagetools inspect "$IMAGE:$SHORT" > /dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::$IMAGE:$SHORT never appeared. Did the Docker image workflow fail?"
          exit 1

      # An older commit whose CI finishes late must not replace a newer :latest.
      - name: Skip if :latest is already newer
        id: order
        run: |
          current=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.[]?.config.Labels["org.opencontainers.image.revision"] // empty][0] // empty' || true)
          echo "Current :latest is ${current:-unknown}"
          if [ "$MANUAL" != "true" ] && [ -n "$current" ] && [ "$current" != "$SHA" ] \
            && git cat-file -e "$current^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$SHA" "$current"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice:::latest ($current) is newer than $SHA; leaving it."
          fi

      - name: Point :latest at the tested image
        if: steps.order.outputs.skip != 'true'
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$SHORT"
          docker buildx imagetools inspect "$IMAGE:latest"

name: Website

# Publishes site/ (plus docs/screenshots) to GitHub Pages — consultainer.app —
# and the docs (docs/*.mdx, built by docs-site/) at consultainer.app/docs/.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "docs-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # Fails on MDX errors, missing Mintlify component shims and broken
      # internal links or anchors.
      - name: Build docs
        working-directory: docs-site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/screenshots _site/screenshots
          cp -r docs-site/dist _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
